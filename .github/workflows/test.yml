name: Test CyborgDB Go SDK
permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.21'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --config .golangci.yml

  compute_version:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.compute.outputs.env }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute environment
        id: compute
        run: |
          # For PRs and main branch pushes, use dev environment
          # For tags, determine based on tag pattern
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
            if [[ "$TAG" == *"rc"* ]]; then
              echo "env=staging" >> $GITHUB_OUTPUT
            else
              echo "env=prod" >> $GITHUB_OUTPUT
            fi
          else
            # Default to dev for PRs and main branch
            echo "env=dev" >> $GITHUB_OUTPUT
          fi

  test:
    runs-on: ubuntu-latest
    # Deliberately not gated on lint: a formatting nit should not stop the
    # suite from running and reporting. compute_version stays because the test
    # job reads its `env` output. Both still gate the PR.
    needs: [compute_version]
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout SDK code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.21'

      - name: Set up Python for server
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TOKEN }}
          CYBORGDB_API_KEY: "op://CyborgDB/CyborgDB ${{ needs.compute_version.outputs.env == 'dev' && 'Dev' || needs.compute_version.outputs.env == 'staging' && 'Staging' || 'Prod' }}/CYBORGDB_API_KEY_STANDARD"

      # BYOK creds for the KMS registry slots written by the "Write KMS registry
      # config" step below (aws-kms-self-test / aws-secrets-self-test). export-env is
      # false so these AWS creds stay out of the job env and are scoped to the
      # steps that need them, mirroring cyborgdb-py's test.yml.
      - name: Load BYOK secrets from 1Password
        id: byok
        uses: 1password/load-secrets-action@v5
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TOKEN }}
          BYOK_AWS_ACCESS_KEY_ID: "op://CyborgDB/CyborgDB Dev/BYOK_AWS_ACCESS_KEY_ID"
          BYOK_AWS_SECRET_ACCESS_KEY: "op://CyborgDB/CyborgDB Dev/BYOK_AWS_SECRET_ACCESS_KEY"
          CYBORGDB_BYOK_ROLE_ARN: "op://CyborgDB/CyborgDB Dev/CYBORGDB_BYOK_ROLE_ARN"
          CYBORGDB_BYOK_EXTERNAL_ID: "op://CyborgDB/CyborgDB Dev/CYBORGDB_BYOK_EXTERNAL_ID"

      # The KMS registry the BYOK and RBAC tests need. cyborgdb-service keeps an
      # equivalent file committed at its repo root, but this repo is public, so
      # it is generated here instead. Contains no secrets: every sensitive value
      # is a ${VAR} placeholder the service expands from the env at startup, and
      # those come from 1Password in the byok step above. The quoted heredoc
      # delimiter keeps bash from expanding the placeholders.
      - name: Write KMS registry config
        run: |
          set -euo pipefail
          cat > "${{ runner.temp }}/cyborgdb.yaml" <<'YAML'
          kms:
            registry:
              # BYOK via AWS Secrets Manager — the wrap key lives in Secrets
              # Manager; service AES-GCM-encrypts each per-index KEK under it.
              aws-secrets-self-test:
                provider:    aws
                key_id:      ${CYBORGDB_SECRETS_KEY_ID:-CYBORGDB_SERVICE_KEY1}
                region:      ${CYBORGDB_AWS_REGION:-us-east-1}
                role_arn:    ${CYBORGDB_BYOK_ROLE_ARN}
                external_id: ${CYBORGDB_BYOK_EXTERNAL_ID}
                role_session_name: cyborgdb-secrets-self-test

              # BYOK via AWS KMS (HSM) — the wrap key never leaves the HSM;
              # `kms:Encrypt` returns ciphertext directly.
              aws-kms-self-test:
                provider:    aws-kms
                key_id:      ${CYBORGDB_KMS_KEY_ID:-alias/CYBORGDB_SERVICE_KEY}
                region:      ${CYBORGDB_AWS_REGION:-us-east-1}
                role_arn:    ${CYBORGDB_BYOK_ROLE_ARN}
                external_id: ${CYBORGDB_BYOK_EXTERNAL_ID}
                role_session_name: cyborgdb-kms-self-test
          YAML
          echo "--- generated registry (placeholders unexpanded) ---"
          cat "${{ runner.temp }}/cyborgdb.yaml"

      - name: Load CodeArtifact account ID from 1Password
        if: needs.compute_version.outputs.env != 'prod'
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TOKEN }}
          CA_AWS_ACCOUNT_ID: "op://CyborgDB/CyborgDB ${{ needs.compute_version.outputs.env == 'dev' && 'Dev' || 'Staging' }}/CA_AWS_ACCOUNT_ID"

      - name: Get CodeArtifact pip index URL
        if: needs.compute_version.outputs.env != 'prod'
        id: ca-url
        uses: ./.github/workflows/actions/codeartifact-pip-url
        with:
          aws-account-id: ${{ env.CA_AWS_ACCOUNT_ID }}
          role-to-assume: arn:aws:iam::${{ env.CA_AWS_ACCOUNT_ID }}:role/CyborgGitHubActionsS3Role
          codeartifact-repository: ${{ needs.compute_version.outputs.env == 'dev' && 'cyborg-dev' || 'cyborg-staging' }}

      - name: Export PIP_INDEX_URL
        if: needs.compute_version.outputs.env != 'prod'
        run: echo "PIP_INDEX_URL=${{ steps.ca-url.outputs.pip-index-url }}" >> $GITHUB_ENV

      - name: Install service dependencies
        run: |
          # Install CPU-only torch
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Install optional test dependencies
          pip install sentence-transformers

      - name: Install cyborgdb-service
        run: |
          # For dev/staging, PIP_INDEX_URL points at CodeArtifact (PyPI upstream). For prod, it is unset and pip falls back to PyPI.
          pip install "cyborgdb-service[embeddings,kms-aws]" --pre

      ## TODO - Add a test for Lite version

      # - name: Test with Lite version
      #   run: |
      #     echo "=== Testing with Lite version ==="
      #     ...

      - name: Test with Standard version
        id: test-standard
        env:
          # KMS slot names test/kms_byok_test.go gates on — they name the
          # registry slots written by the "Write KMS registry config" step.
          CYBORGDB_KMS_NAME_REAL: aws-kms-self-test
          CYBORGDB_KMS_NAME_SM: aws-secrets-self-test
          # Point the service at that generated registry.
          CYBORGDB_CONFIG_FILE: ${{ runner.temp }}/cyborgdb.yaml
          # Static BYOK creds the slots' role_arn/external_id are assumed with.
          AWS_ACCESS_KEY_ID: ${{ steps.byok.outputs.BYOK_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.byok.outputs.BYOK_AWS_SECRET_ACCESS_KEY }}
          CYBORGDB_BYOK_ROLE_ARN: ${{ steps.byok.outputs.CYBORGDB_BYOK_ROLE_ARN }}
          CYBORGDB_BYOK_EXTERNAL_ID: ${{ steps.byok.outputs.CYBORGDB_BYOK_EXTERNAL_ID }}
        run: |
          echo "=== Testing with Standard version ==="
          # The static BYOK key must not be combined with the OIDC session token
          # left in the env by the CodeArtifact step — that would assume the
          # wrong principal when the service reaches KMS / Secrets Manager.
          unset AWS_SESSION_TOKEN
          # Set up environment for Standard
          export CYBORGDB_API_KEY="${CYBORGDB_API_KEY}"
          export CYBORGDB_DB_TYPE=disk
          export CYBORGDB_SERVICE_LOG_LEVEL=DEBUG
          export CYBORGDB_BASE_URL=http://localhost:8000
          
          # Start the service with Standard API key
          nohup cyborgdb-service > server-standard.log 2>&1 &
          echo $! > server-standard.pid
          
          # Wait for service to be ready
          for i in {1..30}; do
            if curl -fs http://localhost:8000/v1/health > /dev/null; then
              echo "Standard service is up!"
              break
            fi
            sleep 1
          done
          
          if ! curl -fs http://localhost:8000/v1/health > /dev/null; then
            echo "Standard service failed to start"
            cat server-standard.log
            exit 1
          fi

          # Run the full test suite on every trigger (PRs and main).
          # Note: -race flag removed because it uses 5-10x more memory which causes
          # the server to crash during auto-training with memory exhaustion
          echo "Running all tests..."
          go test -v -coverprofile=coverage.txt -covermode=atomic -coverpkg=github.com/cyborginc/cyborgdb-go ./test
          
          # Stop standard server
          kill $(cat server-standard.pid) || true

      # RBAC pass. CYBORGDB_SERVICE_ROOT_KEY switches the service from "auth
      # disabled" to "auth required" for every request, so RBAC cannot share the
      # service instance above — it needs its own, started with the key. The
      # licensed CYBORGDB_API_KEY doubles as the root key, so this needs no
      # additional secret.
      #
      # Without this step test/rbac_users_test.go skips on every run: it needs
      # both a root key and a KMS slot, and neither was ever set here.
      - name: RBAC tests
        if: ${{ !cancelled() && steps.test-standard.outcome != 'skipped' }}
        env:
          CYBORGDB_SERVICE_ROOT_KEY: ${{ env.CYBORGDB_API_KEY }}
          # Same registry slots and BYOK credentials as the main test step —
          # user keys resolve the index KEK server-side, so RBAC only works
          # against a KMS-backed index.
          CYBORGDB_KMS_NAME_REAL: aws-kms-self-test
          CYBORGDB_KMS_NAME_SM: aws-secrets-self-test
          CYBORGDB_CONFIG_FILE: ${{ runner.temp }}/cyborgdb.yaml
          AWS_ACCESS_KEY_ID: ${{ steps.byok.outputs.BYOK_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.byok.outputs.BYOK_AWS_SECRET_ACCESS_KEY }}
          CYBORGDB_BYOK_ROLE_ARN: ${{ steps.byok.outputs.CYBORGDB_BYOK_ROLE_ARN }}
          CYBORGDB_BYOK_EXTERNAL_ID: ${{ steps.byok.outputs.CYBORGDB_BYOK_EXTERNAL_ID }}
        run: |
          set -euo pipefail
          echo "=== RBAC pass (authentication enabled) ==="
          unset AWS_SESSION_TOKEN

          # Fail loudly rather than letting the suite skip silently — a skip
          # here would mean this setup broke and nobody noticed.
          : "${CYBORGDB_SERVICE_ROOT_KEY:?root key is empty; RBAC tests would skip}"
          : "${CYBORGDB_KMS_NAME_REAL:?KMS slot is empty; RBAC tests would skip}"

          # Wait for the port to free up after the standard server was killed.
          for i in {1..15}; do
            curl -fs http://localhost:8000/v1/health > /dev/null || break
            sleep 1
          done

          export CYBORGDB_DB_TYPE=disk
          export CYBORGDB_SERVICE_LOG_LEVEL=DEBUG
          export CYBORGDB_BASE_URL=http://localhost:8000
          # Fresh data directory so this service does not inherit indexes
          # created while authentication was disabled.
          export CYBORGDB_DISK_PATH="${RUNNER_TEMP}/cyborgdb-rbac-disk"

          nohup cyborgdb-service > server-rbac.log 2>&1 &
          echo $! > server-rbac.pid

          # /v1/health is unauthenticated, so it stays a valid readiness probe.
          for i in {1..30}; do
            if curl -fs http://localhost:8000/v1/health > /dev/null; then
              echo "RBAC service is up!"
              break
            fi
            sleep 1
          done
          if ! curl -fs http://localhost:8000/v1/health > /dev/null; then
            echo "RBAC service failed to start"
            cat server-rbac.log
            exit 1
          fi

          # The RBAC suite, plus the auth assertion that is only meaningful
          # with authentication enabled.
          go test -v ./test -run 'TestRBAC|TestInvalidAPIKeyRejected'

          kill "$(cat server-rbac.pid)" 2>/dev/null || true

      # Both servers are started with nohup and killed inline on the happy
      # path; a failing test step exits before its kill line, so this is the
      # only cleanup that runs on failure. Mirrors cyborgdb-py's test.yml.
      - name: Kill Server
        if: always()
        run: |
          if [ -f server-standard.pid ]; then
            kill $(cat server-standard.pid) || true
          fi
          if [ -f server-rbac.pid ]; then
            kill $(cat server-rbac.pid) || true
          fi

      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.txt
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true